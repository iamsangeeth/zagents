[project]
name = "zagents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sangeeth M S", email = "iamsangeethms@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "ollama>=0.6.2",
    "openai>=2.52.0",
    "playwright>=1.62.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-ai>=2.22.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "redis>=8.1.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.51",
    "typer>=0.27.0",
]

[project.scripts]
zagents = "zagents:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
